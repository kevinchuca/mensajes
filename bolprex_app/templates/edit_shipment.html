{% extends 'base.html' %}
{% block content %}
<h3>Editar envío</h3>
<form method="post" action="{{ url_for('main.update_shipment', shipment_id=s.id) }}">
  <div class="mb-3">
    <label>Número de guía</label>
    <input class="form-control" name="numero_guia" value="{{ s.numero_guia }}" required>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label>Remitente</label>
      <input class="form-control" name="sender_name" value="{{ s.sender_name }}" required>
    </div>
    <div class="col-md-6 mb-3">
      <label>Destinatario</label>
      <input class="form-control" name="recipient_name" value="{{ s.recipient_name }}" required>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label>Origen</label>
      <input class="form-control" name="origin_city" value="{{ s.origin_city }}" required>
    </div>
    <div class="col-md-6 mb-3">
      <label>Destino</label>
      <input class="form-control" name="destination_city" value="{{ s.destination_city }}" required>
    </div>
  </div>
  <div class="mb-3">
    <label>Dirección</label>
    <input class="form-control" name="address" value="{{ s.address }}" required>
  </div>
  <div class="mb-3">
    <label>Notas</label>
    <textarea class="form-control" name="notes">{{ s.notes }}</textarea>
  </div>
  <button class="btn btn-primary">Guardar cambios</button>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
