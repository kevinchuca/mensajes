{% extends 'base.html' %}
{% block content %}
<h3>Nuevo envío</h3>
<form method="post" action="{{ url_for('main.create_shipment') }}">
  <div class="mb-3">
    <label>Número de guía</label>
    <input class="form-control" name="numero_guia" required>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label>Remitente</label>
      <input class="form-control" name="sender_name" required>
    </div>
    <div class="col-md-6 mb-3">
      <label>Destinatario</label>
      <input class="form-control" name="recipient_name" required>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label>Origen</label>
      <select name="origin_city" class="form-select">
        {% for c in cities %}<option>{{ c }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label>Destino</label>
      <select name="destination_city" class="form-select">
        {% for c in cities %}<option>{{ c }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <div class="mb-3">
    <label>Dirección</label>
    <input class="form-control" name="address" required>
  </div>
  <div class="mb-3">
    <label>Cliente</label>
    <select name="client_id" class="form-select">
      <option value="">- Ninguno -</option>
      {% for u in clients %}<option value="{{ u.id }}">{{ u.name }} ({{ u.email }})</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label>Mensajero</label>
    <select name="messenger_id" class="form-select">
      <option value="">- Ninguno -</option>
      {% for u in messengers %}<option value="{{ u.id }}">{{ u.name }} ({{ u.city }})</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label>Notas</label>
    <textarea class="form-control" name="notes"></textarea>
  </div>
  <button class="btn btn-success">Crear envío</button>
</form>
{% endblock %}
